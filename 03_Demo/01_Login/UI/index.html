<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SpaCare – Demo: Login and roles</title><style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f1ea;--card:#fffdf9;--ink:#23312f;--mute:#6b7a77;--line:#ded6c9;--teal:#1f7a74;--teal-d:#15544f;--sand:#e9dfd0;--ok:#2e7d4f;--warn:#b7791f;--bad:#b3392f;--c1:#d6ece8;--c2:#f7e6c4;--c3:#cfe3f5;--c4:#d9ead3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b1a;--card:#1c2625;--ink:#e8efed;--mute:#97a8a4;--line:#2f3d3b;--teal:#4fb6ae;--teal-d:#7fd0c9;--sand:#26332f;--c1:#21423f;--c2:#4a3d1f;--c3:#233a52;--c4:#2b4226}}
:root[data-theme="dark"]{--bg:#141b1a;--card:#1c2625;--ink:#e8efed;--mute:#97a8a4;--line:#2f3d3b;--teal:#4fb6ae;--teal-d:#7fd0c9;--sand:#26332f;--c1:#21423f;--c2:#4a3d1f;--c3:#233a52;--c4:#2b4226}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,sans-serif}
h1,h2,h3{font-family:Georgia,"Iowan Old Style",serif;font-weight:600;margin:0 0 .5rem}
button,select,input{font:inherit;color:inherit}
.btn{background:var(--teal);color:#fff;border:0;padding:.5rem 1rem;border-radius:8px;cursor:pointer}.btn:hover{background:var(--teal-d)}
.btn.ghost{background:transparent;color:var(--teal);border:1px solid var(--teal)}.btn.bad{background:var(--bad)}
input,select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.45rem .6rem;max-width:100%}
.login{max-width:360px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:2rem}
.login label{display:block;margin:.8rem 0 .2rem;color:var(--mute)}.login input{width:100%}.login .btn{width:100%;margin-top:1.2rem}
header{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;padding:.7rem 1rem;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header b{font-family:Georgia,serif;font-size:1.2rem;color:var(--teal);margin-right:1rem}
nav{display:flex;gap:.25rem;flex-wrap:wrap;flex:1}nav button{background:none;border:0;padding:.4rem .8rem;border-radius:8px;cursor:pointer;color:var(--mute)}nav button.on{background:var(--sand);color:var(--ink)}
main{max-width:1100px;margin:0 auto;padding:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:1rem;margin-bottom:1rem}
.cal{overflow-x:auto}.grid{display:grid;grid-template-columns:56px repeat(3,minmax(150px,1fr));min-width:600px;border-top:1px solid var(--line)}
.grid>div{border-bottom:1px solid var(--line);border-left:1px solid var(--line);min-height:30px;font-size:12px;position:relative}.grid .t{color:var(--mute);padding:4px;border-left:0}.grid .h{font-weight:600;padding:6px;background:var(--sand);font-size:13px}
.off{background:repeating-linear-gradient(45deg,transparent 0 6px,var(--sand) 6px 8px)}
.blk{position:absolute;left:3px;right:3px;top:2px;border-radius:6px;padding:3px 6px;cursor:pointer;overflow:hidden;border-left:4px solid var(--teal);z-index:2}
.s-CONFIRMED{background:var(--c1)}.s-CHECKED_IN{background:var(--c3)}.s-IN_PROGRESS{background:var(--c2)}.s-COMPLETED{background:var(--c4)}.s-CANCELLED{background:var(--sand);opacity:.6;text-decoration:line-through}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;background:var(--sand)}
.row{display:flex;gap:1rem;flex-wrap:wrap}.row>*{flex:1 1 280px}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin:.5rem 0}.slot{padding:.3rem .6rem;border:1px solid var(--teal);border-radius:8px;background:none;cursor:pointer;color:var(--teal)}.slot.busy{border-color:var(--line);color:var(--mute);text-decoration:line-through}.slot.sel{background:var(--teal);color:#fff}
table{width:100%;border-collapse:collapse}td,th{padding:.4rem .5rem;border-bottom:1px solid var(--line);text-align:left}
.bar{height:8px;background:var(--sand);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7rem 1.1rem;border-radius:10px;max-width:90vw;z-index:20}.toast.bad{background:var(--bad);color:#fff}
.chk{display:flex;gap:.5rem;align-items:center;padding:.15rem 0}.big{font-size:1.5rem;font-family:Georgia,serif}
@media(max-width:600px){main{padding:.6rem}}
</style></head><body>
<main style="max-width:420px"><div class="card" id="box"></div><p style="color:var(--mute);font-size:13px">Demo accounts: letan01, ktv_lan, ql_hoa, admin – password 123456. Five wrong attempts lock an account (reload the page to reset).</p></main>
<script>
const R={letan01:['Receptionist',['Book appointments','Reschedule / cancel','Check-in customers','Take payment','Manage customers']],ktv_lan:['Technician',['View own schedule','Start / complete service']],ql_hoa:['Manager',['Everything a receptionist can do','Staff, shifts, promotions, inventory','Reports']],admin:['Admin',['All functions','User and role management']]};
const fails={};
function toast(t,bad){const e=document.createElement('div');e.className='toast'+(bad?' bad':'');e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),3200)}
function form(){document.getElementById('box').innerHTML='<h1>SpaCare</h1><p style="color:var(--mute)">Log in to continue</p><label>Username</label><br><input id="u" value="letan01" style="width:100%"><p><label>Password</label><br><input id="p" type="password" value="123456" style="width:100%"></p><button class="btn" style="width:100%" onclick="go()">Log in</button>'}
function go(){const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;
 if((fails[u]||0)>=5)return toast('Account locked after 5 failed attempts (NFR-02).',1);
 if(R[u]&&p==='123456'){fails[u]=0;const[r,l]=R[u];document.getElementById('box').innerHTML='<h2>Welcome, '+u+'</h2><span class="tag">'+r+'</span><p>This role may:</p><ul>'+l.map(x=>'<li>'+x+'</li>').join('')+'</ul>'+(r==='Technician'?'<p style="color:var(--bad)">Technicians cannot take payment.</p>':'')+'<button class="btn ghost" onclick="form()">Log out</button>';return}
 if(R[u]){fails[u]=(fails[u]||0)+1;toast('Wrong password ('+fails[u]+'/5).'+(fails[u]>=5?' Account is now locked.':''),1)}else toast('Unknown username.',1)}
form();
</script></body></html>
